name: Publish Posts

on:
  push:
    paths:
      - 'posts/*.md'
  workflow_dispatch: # Omogoči gumb "Run workflow" v GitHub vmesniku

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Pri ročnem zagonu vzemi vse .md datoteke iz mape posts/
            FILES=$(ls posts/*.md 2>/dev/null | xargs || true)
          else
            # Pri pushu vzemi samo spremenjene datoteke v zadnjem commitu
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep '^posts/.*\.md$' | xargs || true)
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run Publish Script
        if: steps.changed-files.outputs.files != ''
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_SERVER: ${{ secrets.MASTODON_SERVER }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node scripts/publish.js ${{ steps.changed-files.outputs.files }}
